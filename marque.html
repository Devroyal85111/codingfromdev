<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

   <marquee behavior="slide" direction="left">hello world</marquee>
   <marquee behavior="slide" direction="right">hello world</marquee>
   <marquee behavior="slide" direction="up">hello world</marquee>
   <marquee behavior="slide" direction="down">hello world</marquee>

    <marquee behavior="scroll" direction="left">hello world</marquee>
    <marquee behavior="scroll" direction="right">hello world</marquee>
    <marquee behavior="scroll" direction="up">hello world</marquee>
    <marquee behavior="scroll" direction="down">hello world</marquee>


    <marquee behavior="alternate" direction="left">hello world</marquee>
    <marquee behavior="alternate" direction="right">hello world</marquee>
    <marquee behavior="alternate" direction="up">hello world</marquee>
    <marquee behavior="alternate" direction="down">hello world</marquee>
     

</body>
</html>
