<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Medal Registration Form</h1>
    <form action="">
       <label for="name">Name:</label>
       <input type="text" id="name" name="name">
       <br><br>
       <label for="Medal Name">Medal Name:</label>
       <input type="text" id="Medal Name" name="Medal Name">
       <br><br>
       <label for="Sir Name">Sir Name:</label>
       <input type="text" id="Sir Name" name="Sir Name">
       <br><br>
       <label for="Country">Country:</label>
       <input type="text" id="Country" name="Country">
       <br><br>
       <label for="Year">Year:</label>
       <input type="text" id="Year" name="Year">
       <br><br>
       <label for="Email">Email:</label>
       <input type="email" id="Email" name="Email">
       <br><br>
       <input type="submit" value="Register">
       <select name="Medal Type" id="Medal Type">
           <option value="Gold">Gold</option>
           <option value="Silver">Silver</option>
           <option value="Bronze">Bronze</option>
       </select>
       <br><br>
       <input type="radio" id="male" name="gender" value="male">
       <label for="male">Male</label>
       <input type="radio" id="female" name="gender" value="female">
       <label for="female">Female</label>
        <input type="radio" id="Other" name="gender" value="other">
       <label for="other">Other</label>
    </form>
</body>
</html>
