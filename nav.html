<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        nav{
            background:#333;
            padding:15px 30px;
        }

        nav ul{
            list-style:none;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        nav ul li{
            margin:0 20px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        nav ul li a:hover{
            color:#FFD700;
        }

        .logo{
            color:white;
            font-size:24px;
            font-weight:bold;
            margin-right:auto;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <div class="logo">My Website</div>

            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
